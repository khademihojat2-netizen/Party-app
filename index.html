<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>مهمونی</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;800;900&display=swap" rel="stylesheet">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root{
    --void:#0a0512;
    --violet:#7b2fff;
    --magenta:#ff2fb0;
    --cyan:#22e5ff;
    --gold:#ffd23f;
    --ink:#f5eefc;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{
    height:100%;
    overflow:hidden;
    background:var(--void);
    font-family:'Vazirmatn', sans-serif;
    color:var(--ink);
  }
  #stage{
    position:relative;
    width:100vw;
    height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
  }

  #lights{
    position:absolute; inset:0;
    opacity:0;
    transition:opacity .8s ease;
    background:
      radial-gradient(circle at 20% 30%, rgba(255,47,176,.55), transparent 45%),
      radial-gradient(circle at 80% 25%, rgba(34,229,255,.5), transparent 45%),
      radial-gradient(circle at 50% 80%, rgba(123,47,255,.55), transparent 50%);
    filter:blur(10px) saturate(1.3);
    animation:drift 9s ease-in-out infinite;
  }
  #lights.on{opacity:1;}
  @keyframes drift{
    0%,100%{transform:scale(1) rotate(0deg);}
    50%{transform:scale(1.25) rotate(8deg);}
  }

  #beam{
    position:absolute; inset:-20%;
    opacity:0;
    transition:opacity .8s ease;
    background:conic-gradient(from 0deg,
      rgba(255,47,176,.25), rgba(34,229,255,.15), rgba(255,210,63,.2),
      rgba(123,47,255,.25), rgba(255,47,176,.25));
    animation:spin 14s linear infinite;
    mix-blend-mode:screen;
  }
  #beam.on{opacity:1;}
  @keyframes spin{ to{ transform:rotate(360deg);} }

  .bit{
    position:absolute; top:-5%;
    width:6px; height:14px;
    border-radius:2px;
    opacity:0;
  }

  #center{
    position:relative; z-index:5;
    text-align:center;
    padding:0 28px;
  }
  .eyebrow{
    letter-spacing:.3em; font-size:12px;
    color:var(--cyan); font-weight:600;
    margin-bottom:10px;
  }
  h1{
    font-size:clamp(28px,8vw,44px);
    font-weight:900; line-height:1.2;
    background:linear-gradient(90deg,var(--magenta),var(--gold),var(--cyan));
    -webkit-background-clip:text; background-clip:text; color:transparent;
    margin-bottom:8px;
  }
  #trackInfo{
    font-size:14px; color:#d8cdee; min-height:20px;
    margin-bottom:26px;
  }
  #tapBtn{
    font-family:inherit; font-size:17px; font-weight:800;
    padding:15px 38px; border-radius:999px; border:none;
    color:var(--void);
    background:linear-gradient(90deg,var(--gold),var(--magenta));
    cursor:pointer; display:none;
    animation:pulseBtn 2.2s ease-in-out infinite;
  }
  #tapBtn.show{display:inline-block;}
  @keyframes pulseBtn{
    0%,100%{box-shadow:0 0 0 0 rgba(255,47,176,.5);}
    50%{box-shadow:0 0 0 16px rgba(255,47,176,0);}
  }
  #muteBtn{
    margin-top:18px; font-family:inherit; font-size:13px; font-weight:600;
    padding:9px 20px; border-radius:999px;
    border:1px solid rgba(255,255,255,.25);
    background:rgba(255,255,255,.06); color:var(--ink);
    cursor:pointer; display:none;
  }
  #muteBtn.show{display:inline-block;}
</style>
</head>
<body>

<div id="stage">
  <div id="lights"></div>
  <div id="beam"></div>

  <div id="center">
    <div class="eyebrow">PARTY MODE</div>
    <h1 id="headline">در حال آماده‌سازی…</h1>
    <div id="trackInfo"></div>
    <button id="tapBtn">پخش موزیک 🎉</button>
    <br>
    <button id="muteBtn">🔇 قطع صدا</button>
  </div>
</div>

<audio id="player" preload="auto"></audio>

<script>
/* ===== تنظیمات ===== */
const JAMENDO_CLIENT_ID = "b0cd7e21";
const MAX_DURATION = 240;      // زیر ۴ دقیقه
const TAGS = "party+dance+electronic";

const player = document.getElementById('player');
const headline = document.getElementById('headline');
const trackInfo = document.getElementById('trackInfo');
const tapBtn = document.getElementById('tapBtn');
const muteBtn = document.getElementById('muteBtn');
const lights = document.getElementById('lights');
const beam = document.getElementById('beam');
const stage = document.getElementById('stage');

const colors = ['#ff2fb0','#22e5ff','#ffd23f','#7b2fff'];
function spawnConfetti(n){
  for(let i=0;i<n;i++){
    const b = document.createElement('div');
    b.className = 'bit';
    b.style.left = Math.random()*100+'vw';
    b.style.background = colors[Math.floor(Math.random()*colors.length)];
    stage.appendChild(b);
    const dur = 2.5 + Math.random()*2;
    b.animate([
      {transform:'translateY(0) rotate(0deg)', opacity:0},
      {opacity:1, offset:0.1},
      {transform:`translateY(105vh) rotate(${360+Math.random()*360}deg)`, opacity:0}
    ], {duration:dur*1000, easing:'linear'});
    setTimeout(()=>b.remove(), dur*1000);
  }
}

/* ===== گرفتن یه آهنگ رندوم واقعی از Jamendo ===== */
async function fetchRandomTrack(){
  const url = `https://api.jamendo.com/v3.0/tracks/?client_id=${JAMENDO_CLIENT_ID}&format=json&limit=40&tags=${TAGS}&durationbetween=30_${MAX_DURATION}&order=popularity_total&audioformat=mp32`;
  const res = await fetch(url);
  const data = await res.json();
  const tracks = data.results || [];
  if(!tracks.length) return null;
  return tracks[Math.floor(Math.random()*tracks.length)];
}

/* ===== پالس نور هماهنگ با صدای واقعی (Web Audio Analyser) ===== */
async function attachAnalyser(){
  const ctx = new (window.AudioContext || window.webkitAudioContext)();
  if(ctx.state === 'suspended'){
    await ctx.resume(); // موبایل‌ها گاهی AudioContext رو معلق نگه میدارن تا صریحاً resume بشه
  }
  const src = ctx.createMediaElementSource(player);
  const analyser = ctx.createAnalyser();
  analyser.fftSize = 256;
  src.connect(analyser);
  analyser.connect(ctx.destination);
  const data = new Uint8Array(analyser.frequencyBinCount);

  function loop(){
    analyser.getByteFrequencyData(data);
    const bass = data.slice(0,8).reduce((a,b)=>a+b,0)/8;
    const scale = 1 + (bass/255)*0.35;
    beam.style.filter = `brightness(${1 + (bass/255)*0.6})`;
    lights.style.transform = `scale(${scale})`;
    if(bass > 150 && Math.random() < 0.15) spawnConfetti(3);
    requestAnimationFrame(loop);
  }
  loop();
}

async function startParty(){
  headline.textContent = 'در حال پیدا کردن آهنگ…';
  const track = await fetchRandomTrack();
  if(!track){
    headline.textContent = 'مشکلی در گرفتن موزیک بود 😕';
    return;
  }
  player.src = track.audio;
  headline.textContent = 'خوش اومدی 🪩';
  trackInfo.textContent = `🎵 ${track.name} — ${track.artist_name}`;

  lights.classList.add('on');
  beam.classList.add('on');
  spawnConfetti(30);

  try{
    await player.play();
    await attachAnalyser();
    muteBtn.classList.add('show');
  }catch(e){
    // مرورگر اجازه پخش خودکار نداد -> یه تاچ ساده لازمه
    tapBtn.classList.add('show');
  }
}

tapBtn.addEventListener('click', async ()=>{
  tapBtn.classList.remove('show');
  await player.play();
  await attachAnalyser();
  muteBtn.classList.add('show');
});

// لایه ایمنی: هر تاچی روی صفحه، اگه صدا هنوز واقعاً پخش نمیشه دوباره تلاش کن
document.addEventListener('click', async ()=>{
  if(player.paused && player.src){
    try{ await player.play(); }catch(e){}
  }
}, {once:false});

muteBtn.addEventListener('click', ()=>{
  if(player.muted){
    player.muted = false;
    muteBtn.textContent = '🔇 قطع صدا';
  }else{
    player.muted = true;
    muteBtn.textContent = '🔊 پخش صدا';
  }
});

/* ===== اتصال به تلگرام ===== */
if(window.Telegram && window.Telegram.WebApp){
  window.Telegram.WebApp.ready();
  window.Telegram.WebApp.expand();
}

startParty();
</script>
</body>
</html>
